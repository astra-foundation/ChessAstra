<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <radialGradient id="bannerBg" cx="30%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#141c33"/>
      <stop offset="50%" stop-color="#090d19"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="60%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="knightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="24" fill="url(#bannerBg)"/>

  <!-- Subtle Constellation Grid -->
  <g opacity="0.15" stroke="#4FACFE" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380" stroke-dasharray="4 4"/>
    <line x1="300" y1="0" x2="300" y2="380" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="380" stroke-dasharray="4 4"/>
    <line x1="700" y1="0" x2="700" y2="380" stroke-dasharray="4 4"/>
    <line x1="900" y1="0" x2="900" y2="380" stroke-dasharray="4 4"/>
    <line x1="1100" y1="0" x2="1100" y2="380" stroke-dasharray="4 4"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke-dasharray="4 4"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke-dasharray="4 4"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 4"/>
  </g>

  <!-- Left Icon Knight Emblem -->
  <g transform="translate(60, 40) scale(0.6)">
    <circle cx="256" cy="256" r="220" fill="none" stroke="#1d2640" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="url(#knightGrad)" stroke-width="2" opacity="0.4"/>
    <path d="M 160 410 L 352 410 L 336 385 L 176 385 Z" fill="url(#knightGrad)" filter="url(#glow)"/>
    <path d="M 176 385 L 336 385 L 324 365 L 188 365 Z" fill="#00F2FE" opacity="0.8"/>
    <path d="M 188 365 L 324 365 L 316 290 L 348 245 L 320 230 L 336 170 L 280 110 L 248 110 L 220 145 L 168 215 L 156 265 L 212 265 L 224 300 L 188 365 Z" fill="url(#knightGrad)" filter="url(#glow)"/>
    <path d="M 280 110 L 256 160 L 220 145 Z" fill="#ffffff" opacity="0.4"/>
    <path d="M 168 215 L 256 220 L 156 265 Z" fill="#00F2FE" opacity="0.5"/>
    <path d="M 280 110 L 336 170 L 276 195 L 256 160 Z" fill="#7F00FF" opacity="0.4"/>
    <line x1="280" y1="110" x2="336" y2="170" stroke="#FFF275" stroke-width="3"/>
    <line x1="336" y1="170" x2="320" y2="230" stroke="#FFF275" stroke-width="3"/>
    <line x1="320" y1="230" x2="348" y2="245" stroke="#FFF275" stroke-width="3"/>
    <circle cx="280" cy="110" r="6" fill="#FFF275" filter="url(#glow)"/>
    <circle cx="336" cy="170" r="5" fill="#FFF275" filter="url(#glow)"/>
    <circle cx="320" cy="230" r="5" fill="#FFF275" filter="url(#glow)"/>
    <circle cx="348" cy="245" r="5" fill="#FFF275" filter="url(#glow)"/>
    <g transform="translate(280, 85) scale(0.6)" filter="url(#glow)">
      <path d="M 0 -25 Q 0 0 25 0 Q 0 0 0 25 Q 0 0 -25 0 Q 0 0 0 -25 Z" fill="#FFF275"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="420" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="72" fill="url(#titleGrad)" letter-spacing="4">
    CHESSASTRA
  </text>

  <text x="425" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="22" fill="#00F2FE" letter-spacing="2">
    NEXT-GENERATION OPEN-SOURCE UCI CHESS ENGINE
  </text>

  <text x="425" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#8FA0C2">
    Derived from Stockfish 19 &amp; SFNNv16 Architecture • Fine-Tuned NNUE • GPLv3
  </text>

  <!-- Badges / Organization link bar -->
  <g transform="translate(425, 275)">
    <rect width="210" height="34" rx="17" fill="#141f3d" stroke="#00F2FE" stroke-width="1"/>
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">
      🏛 astra-foundation
    </text>

    <rect x="225" width="160" height="34" rx="17" fill="#141f3d" stroke="#4FACFE" stroke-width="1"/>
    <text x="240" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">
      ⚡ SFNNv16 NNUE
    </text>

    <rect x="400" width="130" height="34" rx="17" fill="#141f3d" stroke="#7F00FF" stroke-width="1"/>
    <text x="415" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">
      🛡 GPLv3 Free
    </text>
  </g>
</svg>
