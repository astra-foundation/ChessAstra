name: ChessAstra Multi-Platform CI & Game Testing

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }} - ${{ matrix.comp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [
          x86-64-sse41-popcnt,
          x86-64-avx2,
          x86-64-bmi2,
          x86-64-avx512,
          x86-64-vnni512,
          x86-64-avxvnni
        ]
        comp: [gcc, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ clang llvm python3-pip

      - name: Download NNUE network
        run: |
          cd src
          make net

      - name: Compile ChessAstra (${{ matrix.arch }})
        run: |
          cd src
          make -j$(nproc) ARCH=${{ matrix.arch }} COMP=${{ matrix.comp }} build

      - name: Run Benchmark Verification
        if: matrix.arch == 'x86-64-sse41-popcnt' || matrix.arch == 'x86-64-avx2'
        run: |
          ./src/chessastra bench

      - name: Run UCI Self-Test Games
        if: matrix.arch == 'x86-64-avx2' && matrix.comp == 'gcc'
        run: |
          python3 -c "
          import subprocess
          p = subprocess.Popen(['./src/chessastra'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          commands = '''
          uci
          isready
          ucinewgame
          position startpos moves e2e4 e7e5 g1f3 b8c6
          go depth 12
          quit
          '''
          out, _ = p.communicate(commands)
          print(out)
          assert 'bestmove' in out
          "

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chessastra-linux-${{ matrix.arch }}-${{ matrix.comp }}
          path: src/chessastra
          retention-days: 7

  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [
          x86-64-sse41-popcnt,
          x86-64-avx2,
          x86-64-bmi2,
          x86-64-avx512
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW via MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc make curl

      - name: Download NNUE & Build (${{ matrix.arch }})
        shell: msys2 {0}
        run: |
          cd src
          make net
          make -j$(nproc) ARCH=${{ matrix.arch }} COMP=gcc build
          if [ "${{ matrix.arch }}" != "x86-64-avx512" ]; then
            ./chessastra.exe bench
          fi

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chessastra-windows-${{ matrix.arch }}
          path: src/chessastra.exe
          retention-days: 7

  build-macos:
    name: macOS Apple Silicon (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [apple-silicon]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NNUE & Compile (${{ matrix.arch }})
        run: |
          cd src
          make net
          make -j$(sysctl -n hw.ncpu) ARCH=${{ matrix.arch }} COMP=clang build
          ./chessastra bench

      - name: Run UCI Engine Game Verification
        run: |
          python3 -c "
          import subprocess
          p = subprocess.Popen(['./src/chessastra'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          commands = '''
          uci
          isready
          ucinewgame
          position startpos moves e2e4 c7c5 g1f3 d7d6
          go depth 12
          quit
          '''
          out, _ = p.communicate(commands)
          print(out)
          assert 'bestmove' in out
          "

      - name: Upload macOS Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chessastra-macos-${{ matrix.arch }}
          path: src/chessastra
          retention-days: 7
